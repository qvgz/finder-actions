name: Build Dev Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      APP_NAME: Finder Actions
      ARCHIVE_NAME: Finder-Actions-dev
      APP_VERSION: 0.0.${{ github.run_number }}

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Build universal dev release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinderActions.xcodeproj \
            -scheme FinderActions \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/${APP_NAME}.app"
          extension="$app/Contents/PlugIns/FinderActionsExtension.appex"
          test -d "$app"
          test -d "$extension"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - "$extension"
          lipo -archs "$app/Contents/MacOS/${APP_NAME}"
          lipo -archs "$extension/Contents/MacOS/FinderActionsExtension"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${ARCHIVE_NAME}.zip"
          shasum -a 256 "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Finder-Actions-dev-${{ github.run_number }}
          path: |
            Finder-Actions-dev.zip
            Finder-Actions-dev.zip.sha256
          if-no-files-found: error

      - name: Replace dev release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          latest_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          notes_file="$RUNNER_TEMP/dev-release-notes.md"

          printf 'Development build from master at [%s](https://github.com/%s/commit/%s).\n\n' \
            "${commit_sha:0:7}" "$GITHUB_REPOSITORY" "$commit_sha" > "$notes_file"
          if [[ -n "$latest_tag" ]]; then
            printf 'Commits since %s:\n\n' "$latest_tag" >> "$notes_file"
            git log "${latest_tag}..HEAD" \
              --pretty=format:'- %s ([%h](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))' \
              >> "$notes_file"
          else
            printf 'Latest commits:\n\n' >> "$notes_file"
            git log -10 \
              --pretty=format:'- %s ([%h](https://github.com/'"$GITHUB_REPOSITORY"'/commit/%H))' \
              >> "$notes_file"
          fi
          printf '\n' >> "$notes_file"

          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev" 2>/dev/null || true
          gh release create dev \
            Finder-Actions-dev.zip \
            Finder-Actions-dev.zip.sha256 \
            --target master \
            --prerelease \
            --title "Finder Actions dev" \
            --notes-file "$notes_file"
