name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      APP_NAME: Finder Actions
      ARCHIVE_NAME: Finder-Actions

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH, for example v1.2.3" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build universal release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinderActions.xcodeproj \
            -scheme FinderActions \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/${APP_NAME}.app"
          extension="$app/Contents/PlugIns/FinderActionsExtension.appex"
          test -d "$app"
          test -d "$extension"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$extension"
          lipo -archs "$app/Contents/MacOS/${APP_NAME}"
          lipo -archs "$extension/Contents/MacOS/FinderActionsExtension"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${ARCHIVE_NAME}-${{ steps.version.outputs.version }}.zip"
          shasum -a 256 "${ARCHIVE_NAME}-${{ steps.version.outputs.version }}.zip" > "${ARCHIVE_NAME}-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: Finder-Actions-${{ steps.version.outputs.version }}
          path: |
            Finder-Actions-${{ steps.version.outputs.version }}.zip
            Finder-Actions-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "Finder-Actions-${{ steps.version.outputs.version }}.zip" \
            "Finder-Actions-${{ steps.version.outputs.version }}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Finder Actions ${{ steps.version.outputs.version }}"
